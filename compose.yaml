name: conversation-service

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pigeon
      POSTGRES_PASSWORD: pigeon
      POSTGRES_DB: conversations
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pigeon -d conversations" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
