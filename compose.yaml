# Local environment for conversation-service.
#   Database only (run the service with dotnet run):  docker compose up -d
#   Database and the service as a container:           docker compose --profile app up -d --build
#   Stop: docker compose --profile app down            Wipe data: add -v
name: conversation-service

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pigeon
      POSTGRES_PASSWORD: pigeon
      POSTGRES_DB: conversations
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pigeon -d conversations"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    environment:
      # Inside the compose network the database is reachable by its service name, not localhost.
      ConnectionStrings__Conversations: "Host=postgres;Port=5432;Database=conversations;Username=pigeon;Password=pigeon"
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
